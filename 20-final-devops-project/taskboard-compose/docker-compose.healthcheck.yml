# Fixes the cold-start race: the backend only starts once Postgres reports healthy.
services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    depends_on: !override
      postgres:
        condition: service_healthy
