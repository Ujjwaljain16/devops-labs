<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React.js - Hello World</title>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16, #111827);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            padding: 2.5rem 3.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 { color: #61dafb; margin-bottom: 0.5rem; }
        p { color: #cbd5e1; font-size: 1.1rem; }
        .badge { background: #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; border: 1px solid #334155; }
        .counter-box { margin-top: 1.5rem; }
        button {
            background: #61dafb;
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #38bdf8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [count, setCount] = React.useState(0);

            return (
                <div className="card">
                    <h1>Hello World from React Application! ⚛️</h1>
                    <p>DevOps Containerization Lab - Section B</p>
                    <span className="badge">Component State Reactive & Powered by Docker</span>
                    <div className="counter-box">
                        <button onClick={() => setCount(count + 1)}>
                            Interactive Click Counter: {count}
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
