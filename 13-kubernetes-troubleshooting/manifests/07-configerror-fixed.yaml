apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
data:
  LOG_LEVEL: "info"
  DATABASE_URL: "postgres://demo-db:5432/app"
---
apiVersion: v1
kind: Pod
metadata:
  name: configerror-demo
  labels:
    demo: configerror
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: DATABASE_URL
