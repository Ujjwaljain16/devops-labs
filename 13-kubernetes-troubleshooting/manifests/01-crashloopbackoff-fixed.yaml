apiVersion: v1
kind: ConfigMap
metadata:
  name: app-env-config
data:
  config.env: |
    APP_MODE=demo
    LOG_LEVEL=info
---
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
  labels:
    demo: crashloop
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting up...'; echo 'reading required config file'; cat /etc/app/config.env; echo 'config loaded, staying up'; sleep 3600"]
      volumeMounts:
        - name: config-volume
          mountPath: /etc/app
  volumes:
    - name: config-volume
      configMap:
        name: app-env-config
