apiVersion: v1
kind: ConfigMap
metadata:
  name: config-that-does-not-exist
data:
  app.conf: "listen 8080;"
---
apiVersion: v1
kind: Pod
metadata:
  name: containercreating-demo
  labels:
    demo: containercreating
spec:
  containers:
    - name: app
      image: nginx:1.27-alpine
      volumeMounts:
        - name: missing-config
          mountPath: /etc/app-config
  volumes:
    - name: missing-config
      configMap:
        name: config-that-does-not-exist
