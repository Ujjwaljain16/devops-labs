name: DevSecOps Pipeline

on:
  push:
    paths:
      - '16-cicd-devsecops/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: 16-cicd-devsecops

env:
  IMAGE_NAME: ghcr.io/ujjwaljain16/devops-labs-devsecops-demo

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v --cov=app --cov-report=term-missing

  sast:
    name: SAST (Bandit)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit
      - run: bandit -r app/

  sca:
    name: SCA (pip-audit)
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  secret-scan:
    name: Secret Scan (Gitleaks)
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan-push:
    name: Docker Build, Image Scan, Security Gate, Push
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker Build
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Container Image Scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'

      - name: Security Gate passed
        run: echo "No CRITICAL vulnerabilities found - gate passed, proceeding to push."

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        run: docker push --all-tags $IMAGE_NAME
