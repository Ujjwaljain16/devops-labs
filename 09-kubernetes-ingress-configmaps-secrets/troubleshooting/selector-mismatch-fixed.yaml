apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-selector-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broken-selector-demo
  template:
    metadata:
      # FIX: label now matches spec.selector.matchLabels above
      labels:
        app: broken-selector-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
