apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image-recover-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broken-image-recover-demo
  template:
    metadata:
      labels:
        app: broken-image-recover-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
