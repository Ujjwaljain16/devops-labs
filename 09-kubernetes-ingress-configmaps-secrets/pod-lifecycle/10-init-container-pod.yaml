apiVersion: v1
kind: Pod
metadata:
  name: init-container-demo
  labels:
    app: init-container-demo
    lifecycle-stage: init-container
spec:
  initContainers:
    - name: setup
      image: busybox:1.36
      command: ["sh", "-c", "echo Running setup steps before the app starts; sleep 8; echo Setup complete"]
  containers:
    - name: nginx
      image: nginx:1.25-alpine
