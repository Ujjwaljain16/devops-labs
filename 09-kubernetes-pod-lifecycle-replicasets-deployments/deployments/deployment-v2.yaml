apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # with 3 desired replicas: at most 1 extra Pod above 3 during the
      # rollout, and at least 2 of the 3 must stay available at all times
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: yatri-backend
          # v1 -> v2 bump: this image tag change is what triggers the
          # rolling update, everything else is identical to deployment-v1.yaml
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-svc
spec:
  selector:
    app: yatri-backend
  ports:
    - port: 80
      targetPort: 80
