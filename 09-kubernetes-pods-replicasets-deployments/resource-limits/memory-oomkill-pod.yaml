apiVersion: v1
kind: Pod
metadata:
  name: memory-oomkill-demo
spec:
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "300M", "--vm-hang", "0"]
      resources:
        requests:
          memory: "50Mi"
        limits:
          memory: "100Mi"
