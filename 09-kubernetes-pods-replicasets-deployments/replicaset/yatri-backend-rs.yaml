apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: yatri-backend-rs
  labels:
    app: yatri-backend-rs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: yatri-backend-rs
  template:
    metadata:
      labels:
        app: yatri-backend-rs
    spec:
      containers:
        - name: yatri-backend
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
