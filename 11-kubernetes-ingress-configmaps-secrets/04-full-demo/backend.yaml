apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-backend-code
  labels:
    app: yatri-app
data:
  server.py: |
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            # password is deliberately reported as set/unset only, never echoed back
            pw = "set (hidden)" if os.environ.get("POSTGRES_PASSWORD") else "MISSING"
            body = (
                "Yatri backend API\n"
                f"path: {self.path}\n"
                f"ENVIRONMENT: {os.environ.get('ENVIRONMENT')}\n"
                f"LOG_LEVEL: {os.environ.get('LOG_LEVEL')}\n"
                f"DEFAULT_CURRENCY: {os.environ.get('DEFAULT_CURRENCY')}\n"
                f"POSTGRES_USER: {os.environ.get('POSTGRES_USER')}\n"
                f"POSTGRES_PASSWORD: {pw}\n"
            )
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())

    HTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8080"))), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-app
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-app
      component: backend
  template:
    metadata:
      labels:
        app: yatri-app
        component: backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8080
          # whole ConfigMap injected in bulk -> every key becomes an env var
          envFrom:
            - configMapRef:
                name: yatri-app-config
          # Secret injected key by key, so only what's needed leaves the Secret
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: yatri-backend-code
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-svc
  labels:
    app: yatri-app
spec:
  selector:
    app: yatri-app
    component: backend
  ports:
    - port: 8080
      targetPort: 8080
