apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 150Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-pvc-demo
  labels:
    demo: dynamic-provisioning
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"written via dynamically-provisioned volume at $(date)\" >> /data/dynamic-demo.txt; sleep 3600"]
      volumeMounts:
        - name: dynamic-volume
          mountPath: /data
  volumes:
    - name: dynamic-volume
      persistentVolumeClaim:
        claimName: dynamic-pvc
