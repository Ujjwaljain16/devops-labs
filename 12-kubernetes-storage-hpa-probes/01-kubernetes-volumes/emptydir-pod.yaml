apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  labels:
    demo: emptydir
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /cache/log.txt; sleep 5; done"]
      volumeMounts:
        - name: cache-volume
          mountPath: /cache
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "tail -f /cache/log.txt"]
      volumeMounts:
        - name: cache-volume
          mountPath: /cache
  volumes:
    - name: cache-volume
      emptyDir: {}
