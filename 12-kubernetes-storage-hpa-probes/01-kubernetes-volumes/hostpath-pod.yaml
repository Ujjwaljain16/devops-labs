apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  labels:
    demo: hostpath
spec:
  containers:
    - name: hostpath-writer
      image: busybox:1.36
      command: ["sh", "-c", "echo \"written from pod $(hostname) at $(date)\" >> /host-data/hostpath-demo.txt; sleep 3600"]
      volumeMounts:
        - name: host-volume
          mountPath: /host-data
  volumes:
    - name: host-volume
      hostPath:
        path: /tmp/k8s-hostpath-demo
        type: DirectoryOrCreate
