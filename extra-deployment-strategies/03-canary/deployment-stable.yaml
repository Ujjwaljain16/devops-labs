apiVersion: v1
kind: ConfigMap
metadata:
  name: stable-content
data:
  index.html: |
    STABLE v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: myapp-canary
      track: stable
  template:
    metadata:
      labels:
        app: myapp-canary
        track: stable
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: stable-content
